[workspace]

[package]
name = "attend_server"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "attend_server-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.1" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4", "serde"] }
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
# Access tokens are encoded and checked here, not with Loco's `JWT` helper, because that reads
# the system time and tokens must use the injected `Clock`. Same major version as Loco's.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

[[bin]]
name = "attend_server-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
# The unit tests of `src/` use `#[tokio::test]`.
tokio = { version = "1.45", features = ["macros"] }
# `output-json` and `output-junit` provide the opt-in CI report writers (see tests/cucumber.rs).
cucumber = { version = "0.21", features = ["output-json", "output-junit"] }

# The Cucumber harness provides its own `main`, so the default test harness is off.
# Run it with: cargo test --test cucumber
[[test]]
name = "cucumber"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
