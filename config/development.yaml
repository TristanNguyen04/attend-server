# Development configuration (LOCO_ENV=development, the default).
# Secrets never go in this file: read them from the environment with get_env.
logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  format: compact

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="localhost") %>
  host: http://localhost

workers:
  mode: BackgroundAsync

database:
  # Matches docker-compose.yml (Postgres on host port 5440).
  uri: <%= get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5440/attend_server_development") %>
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="1") %>
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    # Signs access tokens (HS256). Base64, as Loco expects. A fixed, public, fake value for local use
    # only (it decodes to readable text); production reads JWT_SECRET from the environment.
    secret: ZGV2LWFuZC10ZXN0LW9ubHktand0LXNlY3JldC1uZXZlci11c2VkLWluLXByb2R1Y3Rpb24hIQ==
    # Lifetime of an access token in seconds (24 hours).
    expiration: 86400
